<section class="container grid" id="map-section">
  <div class="lg:w-111 right-sidebar lg:justify-self-end bg-white rounded-sm lg:h-177.5 lg:pb-7.5 lg:pr-7.5 flex flex-col">
    <div class="mb-7 lg:mb-6 p-3.5 pb-0! lg:p-7.5 max-md:pt-5.5 lg:pr-0">
      <p class="font-medium md:font-light text-base md:text-3xl mb-5">
        Карта организаций<br class="md:hidden"/>
        и представительств
      </p>

      <form class="grow flex items-center relative border-b border-grey gap-x-2.5">
        <button type="submit" class="absolute left-0 top-0">
          <img src="./static/imgs/icons/loop.svg" alt="">
        </button>

        <input type="text" placeholder="Город, страна..." class="pb-2.5 pl-7 placeholder:text-black text-xs w-full"/>
      </form>
    </div>

    <div data-simplebar class="max-lg:hidden pr-5 pl-7.5 min-h-0 h-full">
      {% for _ in range(20) %}
      <a href="#" class="group after:absolute after:inset-x-0 after:bottom-0 after:bg-grey after:h-px last:after:hidden flex items-center z-1 gap-x-2.5 py-6 pr-2.5 text-tiny relative before:absolute before:inset-y-0 before:-left-4 before:right-0 before:bg-grey2 before:rounded-sm before:opacity-0 hover:before:opacity-100 before:-z-1">
        <div class="grow">
          <p class="mb-2.5 text-accent uppercase font-medium"><span class="font-bold">Берлин</span> · германия</p>
          <p class="mb-2 text-base font-bold -tracking-2">Представительство Всемирного Конгресса Татар в Германии</p>
          <p class="text-thumb-button">Dorotheenstraße 30, 10117 Berlin, Германия</p>
        </div>

        <img src="./static/imgs/icons/arrow-up-right-black.svg" alt="" width="50" height="50" class="opacity-50 group-hover:opacity-100" />
      </a>
      {% endfor %}
    </div>
  </div>

  <div class="map bg-white rounded-r-sm"></div>

  <button class="lg:w-111! lg:justify-self-end mt-5 lg:mt-2.5 show-more-btn">Все организации и представительства</button>
</section>
